services:
  mysql:
    image: mysql:8.0
    container_name: ${PROJECT_NAME}-mysql
    restart: always
    env_file:
      - ./application-env.properties
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
    ports:
      - "${MYSQL_PORT}:3306"
    volumes:
      - ecc-mysql-data:/var/lib/mysql
    networks:
      - ecc-network

  redis:
    image: redis:7-alpine
    container_name: ${PROJECT_NAME}-redis
    restart: always
    env_file:
      - ./application-env.properties
    command: redis-server --requirepass ${REDIS_PASSWORD}
    ports:
      - "${REDIS_PORT}:6379"
    volumes:
      - ecc-redis-data:/data
    networks:
      - ecc-network

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ${PROJECT_NAME}-backend
    restart: always
    env_file:
      - ./application-env.properties
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_DATA_REDIS_PASSWORD: ${REDIS_PASSWORD}
    ports:
      - "${APP_PORT:-8080}:8080"
    depends_on:
      - mysql
      - redis
    networks:
      - ecc-network

  frontend:
    build:
      context: ../ecc-frontend
      dockerfile: Dockerfile
    container_name: ${PROJECT_NAME}-frontend
    restart: always
    environment:
      NEXT_PUBLIC_API_URL: http://backend:8080
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - ecc-network

# Volume lưu dữ liệu MySQL và Redis trong container
volumes:
  ecc-mysql-data:
  ecc-redis-data:

# Network nội bộ cho các container ECC
networks:
  ecc-network:
    driver: bridge